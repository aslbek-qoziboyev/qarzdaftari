<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login to Qarz daftari</title>
  </head>
  <body style="margin:0; padding:0; background-color:#f3f4f6; font-family:Arial, Helvetica, sans-serif; color:#0f172a;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f3f4f6; padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px; background-color:#ffffff; border-radius:16px; overflow:hidden; border:1px solid #e2e8f0;">
            <tr>
              <td style="padding:24px 24px 12px; background:linear-gradient(135deg, #8b5cf6, #3b82f6); color:#ffffff;">
                <h1 style="margin:0; font-size:28px;">Qarz daftari</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:32px 24px;">
                <p style="margin:0 0 16px; font-size:16px;">Salom!</p>
                <p style="margin:0 0 24px; font-size:16px; line-height:1.6;">
                  Qarz daftari tizimiga kirish uchun quyidagi havolani bosing.
                </p>
                <p style="margin:0 0 24px; text-align:center;">
                  <a href="{{ .ConfirmationURL }}" style="display:inline-block; background:linear-gradient(135deg, #8b5cf6, #3b82f6); color:#ffffff; text-decoration:none; font-weight:bold; padding:14px 24px; border-radius:10px;">
                    Kirish
                  </a>
                </p>
                <p style="margin:0; font-size:14px; line-height:1.6; color:#475569;">
                  Agar tugma ishlamasa, quyidagi havolani nusxalab kiriting:<br />
                  <a href="{{ .ConfirmationURL }}" style="color:#2563eb; word-break:break-all;">{{ .ConfirmationURL }}</a>
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
